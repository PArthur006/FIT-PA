<div class="max-w-6xl mx-auto p-4 md:p-6 text-gray-800">
  <h1 class="text-3xl font-bold mb-6 text-blue-600">Nova Rotina de Treino</h1>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
    
    <!-- COLUNA 1: CATÁLOGO DE EXERCÍCIOS -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
      <h2 class="text-xl font-semibold mb-4">Catálogo de Exercícios</h2>
      
      <div class="flex flex-col sm:flex-row gap-3 mb-4">
        <input 
          type="text" 
          [(ngModel)]="termoPesquisa" 
          (input)="aplicarFiltros()"
          placeholder="Buscar exercício..." 
          class="flex-1 p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 outline-none"
        >
        <select 
          [(ngModel)]="grupoSelecionado" 
          (change)="aplicarFiltros()"
          class="p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 outline-none bg-white">
          <option *ngFor="let grupo of gruposMusculares" [value]="grupo">{{ grupo }}</option>
        </select>
      </div>

      <div class="max-h-96 overflow-y-auto border border-gray-200 rounded divide-y">
        <div *ngFor="let ex of exerciciosFiltrados" class="p-3 flex justify-between items-center hover:bg-gray-50 transition">
          <div>
            <p class="font-medium text-gray-800">{{ ex.nome }}</p>
            <p class="text-xs text-gray-500">{{ ex.grupoMuscular }}</p>
          </div>
          <button 
            (click)="adicionarAoTreino(ex)"
            class="px-3 py-1 bg-blue-100 text-blue-600 font-medium rounded hover:bg-blue-200 transition">
            + Adicionar
          </button>
        </div>
        
        <div *ngIf="exerciciosFiltrados.length === 0" class="p-6 text-center text-gray-500">
          Nenhum exercício encontrado.
        </div>
      </div>
    </div>

    <!-- COLUNA 2: MONTAGEM DA ROTINA -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col h-full">
      <h2 class="text-xl font-semibold mb-4">Sua Rotina</h2>
      
      <input 
        type="text" 
        [(ngModel)]="nomeRotina" 
        placeholder="Nome da rotina (ex: Treino de Costas)" 
        class="w-full p-2 border-b-2 border-gray-300 focus:border-blue-500 mb-6 outline-none text-lg font-medium bg-transparent"
      >

      <div *ngIf="exercicioNaRotina.length === 0" class="text-center text-gray-400 py-10 flex-1">
        Nenhum exercício adicionado ainda.<br>Selecione no catálogo ao lado.
      </div>

      <div class="flex-1 overflow-y-auto mb-4 space-y-2">
        <div *ngFor="let item of exercicioNaRotina; let i = index" 
             class="p-3 bg-gray-50 border border-gray-200 rounded flex flex-wrap items-center gap-3">
          
          <div class="flex-1 min-w-[150px]">
            <p class="font-medium text-gray-800">
              <span class="text-blue-500 font-bold mr-2">{{i + 1}}.</span>
              {{ item.exercicio.nome }}
            </p>
          </div>

          <div class="flex items-center gap-2">
            <label class="text-sm text-gray-600 font-medium">Séries:</label>
            <input type="number" [(ngModel)]="item.series" min="1" class="w-16 p-1 border border-gray-300 rounded text-center focus:ring-2 focus:ring-blue-500 outline-none">
          </div>

          <div class="flex gap-1 ml-auto">
            <button (click)="mover(i, -1)" [disabled]="i === 0" class="p-1 text-gray-500 hover:text-blue-600 disabled:opacity-30 transition" title="Mover para cima">
              ⬆️
            </button>
            <button (click)="mover(i, 1)" [disabled]="i === exercicioNaRotina.length - 1" class="p-1 text-gray-500 hover:text-blue-600 disabled:opacity-30 transition" title="Mover para baixo">
              ⬇️
            </button>
            <button (click)="removerDoTreino(i)" class="p-1 text-red-500 hover:text-red-700 ml-2 transition" title="Remover exercício">
              ❌
            </button>
          </div>
        </div>
      </div>

      <div *ngIf="mensagemSucesso" class="p-3 mb-4 bg-green-100 text-green-700 rounded text-center font-medium">
        {{ mensagemSucesso }}
      </div>

      <button 
        (click)="salvarRotina()"
        [disabled]="!nomeRotina || exercicioNaRotina.length === 0"
        class="w-full py-3 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 transition disabled:opacity-50 disabled:cursor-not-allowed mt-auto">
        Salvar Rotina de Treino
      </button>
    </div>

  </div>
</div>
