<div class="max-w-3xl mx-auto p-4 lg:p-6 mb-24">
  
  <!-- Cabeçalho -->
  <div class="mb-8">
    <h1 class="text-3xl font-bold text-white">Minhas Rotinas</h1>
    <p class="text-gray-400 mt-1">Gerencie suas fichas de treino.</p>
  </div>

  <!-- Estado Vazio (Nenhuma rotina cadastrada) -->
  <div *ngIf="rotinas.length === 0" class="bg-ultra-card border border-gray-800 rounded-2xl p-10 text-center flex flex-col items-center shadow-lg mb-8">
    <div class="bg-gray-800 p-4 rounded-full mb-4 text-ultra-purple">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
      </svg>
    </div>
    <h2 class="text-xl font-semibold text-white mb-2">Nenhuma rotina encontrada</h2>
    <p class="text-gray-500 mb-6 max-w-sm">Você ainda não tem fichas de treino estruturadas. Crie sua primeira rotina para começar.</p>
  </div>

  <!-- Lista de Rotinas (Aparecerá quando o array for preenchido) -->
  <div *ngIf="rotinas.length > 0" class="space-y-4 mb-8">
    <!-- Estrutura do card da rotina entrará aqui depois -->
  </div>

  <!-- Botão de Ação -->
  <button 
    routerLink="/nova-rotina" 
    class="w-full bg-transparent border-2 border-ultra-purple text-ultra-purple py-4 rounded-xl font-bold hover:bg-ultra-purple hover:text-white transition-all flex items-center justify-center gap-2 shadow-[0_0_15px_rgba(157,0,255,0.15)]"
  >
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
    </svg>
    CRIAR NOVA ROTINA
  </button>

</div>
