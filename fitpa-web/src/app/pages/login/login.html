<div class="min-h-screen bg-ultra-dark flex items-center justify-center p-4">
  
  <!-- Card de Login -->
  <div class="bg-ultra-card border border-gray-800 rounded-2xl shadow-2xl p-8 w-full max-w-md">
    
    <!-- Logo / Título -->
    <div class="text-center mb-8">
      <h1 class="text-4xl font-black text-white tracking-wider mb-1">
        FIT<span class="text-ultra-purple">PA</span>
      </h1>
      <p class="text-gray-400 text-sm mt-1">Acesso ao Sistema</p>
    </div>

    <!-- Alertas de Erro -->
    <div *ngIf="erro" class="mb-6 p-3 bg-red-900/20 border border-red-500/50 text-red-400 text-sm rounded-lg text-center font-medium">
      {{ erro }}
    </div>

    <form (ngSubmit)="entrar()" #loginForm="ngForm" class="space-y-5">
      
      <!-- Usuário -->
      <div>
        <label class="block text-sm font-medium text-gray-400 mb-1">Usuário</label>
        <input 
          type="text" 
          name="username" 
          [(ngModel)]="credenciais.username" 
          [disabled]="precisaMfa || carregando"
          class="w-full bg-ultra-dark text-white px-4 py-3 rounded-xl border border-gray-700 focus:outline-none focus:border-ultra-purple transition placeholder-gray-600 disabled:opacity-50"
          placeholder="Digite seu usuário"
          required>
      </div>

      <!-- Senha -->
      <div>
        <label class="block text-sm font-medium text-gray-400 mb-1">Senha</label>
        <input 
          type="password" 
          name="password" 
          [(ngModel)]="credenciais.password" 
          [disabled]="precisaMfa || carregando"
          class="w-full bg-ultra-dark text-white px-4 py-3 rounded-xl border border-gray-700 focus:outline-none focus:border-ultra-purple transition placeholder-gray-600 disabled:opacity-50"
          placeholder="••••••••"
          required>
      </div>

      <!-- MFA (Só aparece se precisaMfa for true) -->
      <div *ngIf="precisaMfa" class="pt-4 border-t border-gray-800">
        <label class="block text-sm font-medium text-ultra-purple mb-1 text-center">Código Authenticator</label>
        <input 
          type="text" 
          name="mfaCode" 
          [(ngModel)]="credenciais.mfaCode" 
          [disabled]="carregando"
          autocomplete="off"
          maxlength="6"
          class="w-full bg-ultra-dark text-white px-4 py-3 rounded-xl border border-ultra-purple/50 focus:outline-none focus:border-ultra-purple transition text-center tracking-[0.5em] font-mono text-xl disabled:opacity-50"
          placeholder="000000">
      </div>

      <!-- Botão Submit -->
      <button 
        type="submit" 
        [disabled]="carregando"
        class="w-full bg-ultra-purple text-white font-bold py-4 rounded-xl shadow-[0_0_15px_rgba(157,0,255,0.4)] hover:scale-[1.02] transition-transform disabled:opacity-50 disabled:hover:scale-100 disabled:cursor-not-allowed mt-2">
        {{ carregando ? 'PROCESSANDO...' : (precisaMfa ? 'VALIDAR CÓDIGO' : 'ENTRAR') }}
      </button>
      
    </form>
  </div>
</div>
