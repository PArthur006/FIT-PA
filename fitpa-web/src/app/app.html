<div class="flex flex-col h-screen overflow-hidden bg-ultra-dark text-white font-sans">
  
  <!-- Área Dinâmica (Telas) -->
  <main class="flex-1 overflow-y-auto pb-24"> <!-- pb-24 impede que o conteúdo fique atrás da barra -->
    <router-outlet></router-outlet>
  </main>

  <!-- Bottom Navigation Bar -->
  <nav *ngIf="mostrarNavbar" class="fixed bottom-0 w-full bg-ultra-card border-t border-gray-800 px-6 py-3 flex justify-between items-center z-50">
    
    <!-- Ícone: Início (Home) -->
    <button routerLink="/" class="flex flex-col items-center text-gray-400 hover:text-ultra-purple transition">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
      </svg>
      <span class="text-[10px] mt-1 font-medium">Início</span>
    </button>

    <!-- Ícone: Exercícios (Catálogo) -->
    <button routerLink="/exercicios" class="flex flex-col items-center text-gray-400 hover:text-ultra-purple transition">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 10h16M4 14h16M4 18h16" />
      </svg>
      <span class="text-[10px] mt-1 font-medium">Exercícios</span>
    </button>

    <!-- Botão Central Destaque: Novo Treino -->
    <div class="relative -top-5">
      <button routerLink="/novo-treino" class="bg-ultra-purple text-white p-4 rounded-full shadow-[0_0_15px_rgba(157,0,255,0.5)] hover:scale-105 transition transform flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
        </svg>
      </button>
    </div>

    <!-- Ícone: Rotinas -->
    <button routerLink="/lista-rotinas" class="flex flex-col items-center text-gray-400 hover:text-ultra-purple transition">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
      </svg>
      <span class="text-[10px] mt-1 font-medium">Rotinas</span>
    </button>

    <!-- Ícone: Perfil -->
    <button routerLink="/perfil" class="flex flex-col items-center text-gray-400 hover:text-ultra-purple transition">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
      </svg>
      <span class="text-[10px] mt-1 font-medium">Perfil</span>
    </button>

  </nav>
</div>
